server {
    listen 80;
    listen [::]:80;
    server_name dsharnessgo.xmmgd.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dsharnessgo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dsharnessgo.xmmgd.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsharnessgo.xmmgd.top;

    ssl_certificate /etc/letsencrypt/live/dsharnessgo.xmmgd.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsharnessgo.xmmgd.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/dsharnessgo/current;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
